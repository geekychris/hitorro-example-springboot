# Each Spring test context gets its own RocksDB store: RocksDB locks its
# directory, so contexts sharing ./data/kvstore fail to start (and every test
# using a failed context fails with it).
hitorro.kvstore.path=target/test-kvstore-${random.uuid}
# Same for the Lucene indexes (Lucene's write.lock).
hitorro.search.index-path=target/test-lucene-${random.uuid}
