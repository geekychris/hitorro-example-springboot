# Hitorro Spring Boot Example Application Configuration

server:
  port: 8080

spring:
  application:
    name: hitorro-example

  # Database configuration  
  datasource:
    url: jdbc:h2:mem:hitorro;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  
  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: create
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true

# Hitorro Configuration
hitorro:
  enabled: true
  
  # Service Configuration
  services:
    enabled: true
    db-init: false
  
  # DMS Configuration
  dms:
    enabled: true
    session-scope: prototype
    
    # Database initialization from CSV files
    db-init:
      enabled: true
      fail-on-error: false
      data-sets:
        - name: "stores"
          csv-file: "classpath:data/stores.csv"
          consumer: "com.hitorro.basedms.csvconsumers.StoreCSVConsumer"
  
  # REST endpoint configuration
  rest:
    enabled: true
    base-path: /api/rest
    expose-internal: false
  
  # Command REST endpoints
  commands:
    rest:
      enabled: true
      base-path: /api/commands
  
  # CLI Configuration
  cli:
    # Native Hitorro CLI (telnet/SSH)
    native-enabled: true
    telnet-port: 5050
    ssh-port: 5022
    
    # Spring Shell integration
    spring-shell-enabled: false
    
    # Actuator endpoint
    actuator-enabled: true

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,hitorro
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.hitorro: DEBUG
    com.hitorro.spring: INFO
    org.hibernate: WARN
