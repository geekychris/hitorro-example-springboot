# AI-Enabled Transformer Configuration
# Copy this to your application.yml or use with: --spring.profiles.active=ai

# Enable Hitorro AI service
hitorro:
  ai:
    enabled: true
    model-name: llama3.2  # Used for logging/identification

  # Transformer service configuration
  transformer:
    enabled: true

# Configure Spring AI with Ollama backend
# This is what the Hitorro AI service wraps
spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2          # For summarization and Q&A
          temperature: 0.7         # 0.0-1.0 (lower = more factual)
      embedding:
        options:
          model: nomic-embed-text  # For vector embeddings

# Logging for transformers and AI service
logging:
  level:
    com.hitorro.basedms.transformer: INFO
    com.hitorro.spring.boot.autoconfigure.ai: INFO
    org.springframework.ai: DEBUG

---
# Example: Development profile with verbose AI logging
spring:
  config:
    activate:
      on-profile: ai-dev
  ai:
    ollama:
      chat:
        options:
          temperature: 0.5  # More deterministic for testing

logging:
  level:
    com.hitorro.basedms.transformer.ai: DEBUG
    com.hitorro.spring.boot.autoconfigure.ai: DEBUG
    org.springframework.ai: TRACE
