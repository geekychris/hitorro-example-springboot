<!DOCTYPE html>
<html>
<head><title>Test Commands</title></head>
<body>
<h1>Testing Commands API</h1>
<button onclick="testAPI()">Test API</button>
<pre id="result"></pre>
<script>
async function testAPI() {
  try {
    const response = await fetch('/api/commands/list');
    const data = await response.json();
    document.getElementById('result').textContent = 
      `SUCCESS: Got ${data.length} commands\n\n` + 
      JSON.stringify(data, null, 2);
  } catch (error) {
    document.getElementById('result').textContent = 
      `ERROR: ${error.message}\n\n${error.stack}`;
  }
}
testAPI(); // Auto-run on load
</script>
</body>
</html>
